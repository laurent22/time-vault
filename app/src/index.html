<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<title>TimeVault</title>
	<style>
		/* The window itself must be fully transparent so per-pixel alpha in the
		   skin PNGs composites against the desktop. Any background colour here
		   would show up as a rectangle. */
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			background: transparent;
			overflow: hidden;
			/* Widget chrome isn't text content — don't let it be selected or
			   drag-and-dropped like a web page. */
			user-select: none;
			-webkit-user-select: none;
			/* Konfabulator's default text rendering. */
			font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
		}

		/* The ported layout code positions everything absolutely, in the
		   original's pixel coordinates. This is the origin it positions
		   against. */
		#stage {
			position: absolute;
			inset: 0;
		}

		/* Skin art is 1x and must not be smoothed when scaled or snapped. */
		#stage img {
			image-rendering: -webkit-optimize-contrast;
		}
	</style>
</head>
<body>
	<div id="stage"></div>

	<!-- ===== shim: must load before any ported code ===== -->
	<script src="shim/bootstrap.js"></script>
	<script src="shim/system.js"></script>
	<script src="shim/filesystem.js"></script>
	<script src="shim/xmldom.js"></script>
	<script src="shim/sqlite.js"></script>
	<script src="shim/prefs-schema.js"></script>
	<script src="shim/preferences.js"></script>
	<script src="shim/image-sizes.js"></script>
	<script src="shim/primitives.js"></script>
	<script src="shim/widgets.js"></script>

	<!-- ===== ported widget code =====
	     This order mirrors the includeFile() calls at the top of Main.js,
	     which is where the original declared its dependencies. -->
	<script src="widget/Localization.js"></script>
	<script src="widget/StringHelper.js"></script>
	<script src="widget/Log.js"></script>
	<script src="widget/ExtendedTimer.js"></script>
	<script src="widget/EventInterface.js"></script>
	<script src="widget/DateHelper.js"></script>
	<script src="widget/Database.js"></script>
	<script src="widget/Imaging.js"></script>
	<script src="widget/SystemHelper.js"></script>

	<script src="widget/Puppeteer.js"></script>
	<script src="widget/Puppeteer.Animation.js"></script>
	<script src="widget/Puppeteer.EaseEquations.js"></script>

	<!-- WidGUI, the UI toolkit Main.js loads at runtime -->
	<script src="widgui/Widgui_Manager.js"></script>
	<script src="widgui/Widgui_UserControl.js"></script>
	<script src="widgui/Widgui_Label.js"></script>
	<script src="widgui/Widgui_Button.js"></script>
	<script src="widgui/Widgui_GraphicButton.js"></script>
	<script src="widgui/Widgui_TextButton.js"></script>
	<script src="widgui/Widgui_DropdownList.js"></script>

	<script src="widget/EventDatabase.js"></script>
	<script src="widget/ProjectEvent.js"></script>
	<script src="widget/Project.js"></script>
	<script src="widget/ProjectPossibleTask.js"></script>
	<!-- FrameWrapper defines the base RoundButton and FlashingButton extend,
	     so it has to come first. -->
	<script src="widget/FrameWrapper.js"></script>
	<script src="widget/ProjectItem.js"></script>
	<script src="widget/PossibleTaskItem.js"></script>
	<script src="widget/RoundButton.js"></script>
	<script src="widget/FlashingButton.js"></script>
	<script src="widget/MainWindow.js"></script>
	<script src="widget/MainDrawer.js"></script>

	<script src="widget/Main.js"></script>
</body>
</html>
