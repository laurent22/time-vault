# Packaging configuration.
#
# Deliberately a separate file rather than a "build" block in package.json:
# electron-builder rewrites package.json in place when the config lives there,
# stripping scripts and devDependencies from the working copy.

appId: net.cozic.timevault
productName: Time Vault
copyright: Copyright © Laurent Cozic, 2007-2026

# No auto-update, so none of its bookkeeping. electron-builder otherwise
# emits a .blockmap beside every installer (for differential downloads) and
# a latest-*.yml manifest (for version discovery), both of which only
# electron-updater reads — and the app doesn't use it.
generateUpdatesFilesForAllChannels: false
dmg:
  writeUpdateInfo: false

directories:
  buildResources: build
  output: dist

files:
  - src/**/*
  - assets/**/*
  - '!**/*.psd'
  - '!**/*.af'

# Notarization runs from the afterSign hook rather than electron-builder's
# own `notarize` option, so the app can also be stapled — see tools/notarize.js.
afterSign: tools/notarize.js

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  # Required for notarization. The entitlements grant the JIT and
  # writable-executable memory Chromium needs, which it otherwise blocks.
  hardenedRuntime: true
  notarize: false
  entitlements: build-mac/entitlements.mac.plist
  entitlementsInherit: build-mac/entitlements.mac.plist
  gatekeeperAssess: false
  # Both architectures, as separate dmgs rather than one universal binary:
  # a universal build bundles two copies of Electron, so it's roughly twice
  # the size for a download most people only need half of.
  target:
    - target: dmg
      arch: [arm64, x64]

win:
  icon: build/icon.png
  # SSL.com cloud eSigner — the certificate is in their HSM, not on disk.
  signtoolOptions:
    sign: tools/sign-windows.js
    rfc3161TimeStampServer: http://timestamp.digicert.com
    # Must match the certificate subject exactly. Joplin's SSL.com
    # certificate is issued to "Joplin", and these are its credentials.
    publisherName:
      - Joplin
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  differentialPackage: false

linux:
  icon: build/icon.png
  category: Utility
  # A .deb refuses to build without a maintainer address. Nothing reads it,
  # so this is a placeholder rather than a real mailbox — report problems on
  # the GitHub issue tracker.
  maintainer: Laurent Cozic <no-reply@example.com>
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]

publish:
  - provider: github
    owner: laurent22
    repo: time-vault
