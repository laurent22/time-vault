name: Release

# Pushing a version tag builds the app on all three platforms and attaches
# the installers to a GitHub release.
#
#   git tag v1.5.6 && git push origin v1.5.6
#
# Pushes and pull requests build too, but publish nothing — so a broken
# packaging step is caught before a tag depends on it.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing shouldn't throw away the other two: on a tag
      # that would leave a release with some assets missing and no way to
      # add the rest without re-running everything.
      fail-fast: false
      matrix:
        # Pinned rather than *-latest: those jump major versions without
        # warning and break a build that was fine the day before. These are
        # what the latest labels resolved to when this was written, so
        # upgrading is a deliberate edit.
        include:
          - os: macos-26
            name: macOS
          - os: ubuntu-24.04
            name: Linux
          - os: windows-2025
            name: Windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # electron-builder names every artefact from package.json, so a tag that
      # disagrees with it would publish v1.5.6 containing TimeVault-0.1.0.dmg.
      # Checked on one platform only; it's the same repository either way.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v') && runner.os == 'Linux'
        working-directory: app
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $pkg."
            echo "Set the version in app/package.json to $tag, commit, then move the tag."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json $pkg"

      - name: Install dependencies
        working-directory: app
        run: npm ci

      # Two Linux-only needs. The suite boots a real Electron renderer, so it
      # needs a display — xvfb. And Chromium's SUID sandbox requires
      # chrome-sandbox to be setuid root, which it isn't after npm ci, so
      # Electron aborts rather than run unsandboxed. Disabling it is safe
      # here: a CI runner is already a throwaway container.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        working-directory: app
        env:
          ELECTRON_DISABLE_SANDBOX: 1
        run: xvfb-run --auto-servernum npm test

      - name: Test
        if: runner.os != 'Linux'
        working-directory: app
        run: npm test

      # electron-builder publishes to the release itself when it sees a tag,
      # creating a draft if there isn't one. On anything else it only packages,
      # which verifies the build without touching releases.
      #
      # Unsigned, for pushes and pull requests: it verifies the packaging
      # without touching releases. Signing is deliberately absent rather than
      # passed empty — electron-builder reads CSC_LINK='' as "a certificate
      # was supplied", then fails with "<app dir> not a file".
      - name: Build (no signing, no publishing)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --publish=never

      # The real thing, on a tag: signed, notarized, and published to the
      # release that electron-builder creates.
      - name: Build and publish
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS: the Developer ID certificate, then notarization.
          CSC_LINK: ${{ secrets.APPLE_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Windows: SSL.com cloud eSigner.
          SIGN_APPLICATION: ${{ runner.os == 'Windows' && '1' || '0' }}
          SSL_ESIGNER_USER_NAME: ${{ secrets.SSL_ESIGNER_USER_NAME }}
          SSL_ESIGNER_USER_PASSWORD: ${{ secrets.SSL_ESIGNER_USER_PASSWORD }}
          SSL_ESIGNER_CREDENTIAL_ID: ${{ secrets.SSL_ESIGNER_CREDENTIAL_ID }}
          SSL_ESIGNER_USER_TOTP: ${{ secrets.SSL_ESIGNER_USER_TOTP }}
        run: npx electron-builder --publish=always

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: timevault-${{ matrix.name }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb
          if-no-files-found: error
          retention-days: 14
